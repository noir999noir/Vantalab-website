<header
  class="site-header"
  [class.scrolled]="scrolled"
  [class.menu-open]="menuOpen"
>
  <div class="nav-wrap container">

    <a
      class="brand"
      href="#home"
      (click)="closeMenu()"
      aria-label="Vantalab home"
    >
      <img
        src="../../../assets/logo/vantalab-mark.jpeg"
        alt="Vantalab mark"
      >
      <span>VANTALAB</span>
    </a>

    <nav class="desktop-nav">
      <a href="#home">Home</a>
      <a href="#servizi">Servizi</a>
      <a href="#vanta">Vanta</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#processo">Processo</a>
    </nav>

    <a class="nav-cta" href="#contatti">
      Parliamo del progetto <span>↗</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Apri o chiudi menu"
    >
      <span></span>
      <span></span>
    </button>

  </div>

  <div
    class="mobile-menu"
    [class.open]="menuOpen"
    [attr.aria-hidden]="!menuOpen"
    [inert]="!menuOpen"
  >

    <div class="mobile-menu-inner">

      <p class="menu-label">NAVIGAZIONE / 01—05</p>

      <a href="#home" (click)="closeMenu()">
        <small>01</small> Home
      </a>

      <a href="#servizi" (click)="closeMenu()">
        <small>02</small> Servizi
      </a>

      <a href="#vanta" (click)="closeMenu()">
        <small>03</small> Vanta AI
      </a>

      <a href="#portfolio" (click)="closeMenu()">
        <small>04</small> Portfolio
      </a>

      <a href="#processo" (click)="closeMenu()">
        <small>05</small> Processo
      </a>

      <a
        class="mobile-contact"
        href="#contatti"
        (click)="closeMenu()"
      >
        Iniziamo un progetto <span>↗</span>
      </a>

      <p class="mobile-bottom">
        DIGITAL IDEAS. REAL IMPACT.
      </p>

    </div>

  </div>
</header>
